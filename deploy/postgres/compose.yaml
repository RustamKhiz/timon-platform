name: timon-sim-postgres

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: timon_sim
      POSTGRES_USER: timon_sim
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - timon_sim_postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:55432:5432"
    networks:
      - timon_sim_database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timon_sim -d timon_sim"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    cpus: 0.75
    pids_limit: 200
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"

networks:
  timon_sim_database:
    name: timon_sim_database
    internal: true

volumes:
  timon_sim_postgres_data:
    name: timon_sim_postgres_data
